tradenix.automation.low-testing.enabled=false
tradenix.automation.low-testing.fail-on-validation=false

tradenix.automation.threshold-validation.enabled=false
tradenix.automation.threshold-validation.stop-on-violation=false
tradenix.automation.thresholds.max-retry-count=3
tradenix.automation.thresholds.element-wait-timeout-ms=15000
tradenix.automation.thresholds.page-load-timeout-ms=60000
tradenix.automation.thresholds.max-execution-time-ms=600000
tradenix.automation.thresholds.max-validation-failures=10
tradenix.automation.thresholds.max-skipped-fields=20
tradenix.automation.thresholds.performance-threshold-ms=3000
tradenix.automation.thresholds.response-time-threshold-ms=5000

tradenix.automation.penetration-testing.enabled=false
tradenix.automation.penetration-testing.stop-on-failure=false
tradenix.automation.penetration-testing.dataset-resource=security/security-test-datasets.json
tradenix.automation.penetration-testing.max-scenarios-per-declaration=5

tradenix.automation.reporting.capture-screenshots-on-threshold=true
tradenix.automation.reporting.include-recommendations=true
tradenix.automation.reporting.include-performance-metrics=true
