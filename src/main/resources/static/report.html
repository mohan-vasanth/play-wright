<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Report</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --text: #16324f;
            --muted: #5f7186;
            --border: #d7e0ea;
            --success: #127a4a;
            --success-bg: #e8f7ef;
            --failure: #b42318;
            --failure-bg: #fdecec;
            --issue: #8a4b00;
            --issue-bg: #fff4df;
            --neutral: #1f6feb;
            --neutral-bg: #eaf2ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at top right, #dcecff 0, transparent 30%),
                linear-gradient(180deg, #f9fbfe 0, var(--bg) 100%);
            color: var(--text);
        }

        .wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        h1, h2, h3 {
            margin: 0;
        }

        h1 {
            font-size: 32px;
            line-height: 1.1;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 14px;
        }

        .sub {
            color: var(--muted);
            margin-top: 6px;
            font-size: 14px;
        }

        button {
            border: 1px solid #0b6bcb;
            background: #0b86d1;
            color: #fff;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(34, 68, 102, 0.08);
        }

        .hero {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 14px;
        }

        .status-SUCCESS {
            color: var(--success);
            background: var(--success-bg);
        }

        .status-PERMIT_ISSUED {
            color: var(--success);
            background: var(--success-bg);
        }

        .status-PMT {
            color: var(--success);
            background: var(--success-bg);
        }

        .status-SUB {
            color: var(--success);
            background: var(--success-bg);
        }

        .status-SNT {
            color: var(--neutral);
            background: var(--neutral-bg);
        }

        .status-FAILURE {
            color: var(--failure);
            background: var(--failure-bg);
        }

        .status-FAILED {
            color: var(--failure);
            background: var(--failure-bg);
        }

        .status-FLD {
            color: var(--failure);
            background: var(--failure-bg);
        }

        .status-REJ {
            color: var(--failure);
            background: var(--failure-bg);
        }

        .status-ISSUE {
            color: var(--issue);
            background: var(--issue-bg);
        }

        .status-DRAFT {
            color: var(--neutral);
            background: var(--neutral-bg);
        }

        .status-DRF {
            color: var(--neutral);
            background: var(--neutral-bg);
        }

        .status-REG {
            color: var(--neutral);
            background: var(--neutral-bg);
        }

        .status-NO_REPORT, .status-SKIPPED {
            color: var(--neutral);
            background: var(--neutral-bg);
        }

        .issue {
            margin-top: 18px;
            font-size: 18px;
            line-height: 1.5;
        }

        .meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .metric {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            background: #fbfdff;
        }

        .metric .label {
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .metric .value {
            font-size: 24px;
            font-weight: 700;
            margin-top: 8px;
        }

        .grid {
            display: grid;
            gap: 20px;
        }

        .cases {
            display: grid;
            gap: 12px;
        }

        .case {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            background: #fff;
        }

        .case-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .case-name {
            font-weight: 700;
            font-size: 18px;
        }

        .case-class, .fine {
            color: var(--muted);
            font-size: 13px;
        }

        .detail-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px 10px;
            background: #f8fbff;
            color: var(--text);
            font-size: 12px;
            text-decoration: none;
        }

        pre {
            margin: 12px 0 0;
            padding: 12px;
            border-radius: 12px;
            background: #0f1720;
            color: #dde7f1;
            overflow: auto;
            white-space: pre-wrap;
            font-size: 12px;
        }

        @media (max-width: 760px) {
            .hero {
                grid-template-columns: 1fr;
            }

            .meta,
            .detail-row {
                grid-template-columns: 1fr 1fr;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <div>
            <h1>Automation Report</h1>
            <div class="sub">Batch declaration results from the latest Maven run</div>
        </div>
        <a href="test-launcher.html" style="text-decoration:none;border:1px solid #0b6bcb;background:#fff;color:#0b86d1;border-radius:10px;padding:10px 16px;font-size:14px;font-family:inherit;cursor:pointer;">Launch Test</a>
        <button id="refreshBtn" type="button">Refresh</button>
    </div>

    <div class="hero">
        <div class="panel">
            <div id="statusBadge" class="status-badge status-NO_REPORT">Loading</div>
            <div id="issue" class="issue">Fetching latest report...</div>
            <div id="source" class="fine" style="margin-top: 14px;"></div>
        </div>
        <div class="meta">
            <div class="metric">
                <div class="label">Declarations</div>
                <div id="batchTotal" class="value">0</div>
            </div>
            <div class="metric">
                <div class="label">Success</div>
                <div id="batchSuccess" class="value">0</div>
            </div>
            <div class="metric">
                <div class="label">Issues</div>
                <div id="batchIssues" class="value">0</div>
            </div>
            <div class="metric">
                <div class="label">Failures</div>
                <div id="batchFailures" class="value">0</div>
            </div>
            <div class="metric">
                <div class="label">Drafts</div>
                <div id="batchDrafts" class="value">0</div>
            </div>
        </div>
    </div>

    <div class="grid">
        <div class="panel">
            <h2 id="batchResultsTitle">Results</h2>
            <div id="batchCases" class="cases"></div>
        </div>

        <div class="panel">
            <h2>JUnit Wrapper</h2>
            <div id="suiteName" class="fine"></div>
            <div id="updatedAt" class="fine" style="margin-top: 6px;"></div>
            <div id="duration" class="fine" style="margin-top: 6px;"></div>
            <div class="detail-row" style="margin-top: 16px;">
                <div class="metric">
                    <div class="label">Wrapper Tests</div>
                    <div id="tests" class="value">0</div>
                </div>
                <div class="metric">
                    <div class="label">Wrapper Failures</div>
                    <div id="failures" class="value">0</div>
                </div>
                <div class="metric">
                    <div class="label">Wrapper Errors</div>
                    <div id="errors" class="value">0</div>
                </div>
                <div class="metric">
                    <div class="label">Wrapper Skipped</div>
                    <div id="skipped" class="value">0</div>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2>Wrapper Test Cases</h2>
            <div id="cases" class="cases"></div>
        </div>
    </div>
</div>

<script>
    const statusBadge = document.getElementById('statusBadge');
    const issue = document.getElementById('issue');
    const source = document.getElementById('source');
    const suiteName = document.getElementById('suiteName');
    const updatedAt = document.getElementById('updatedAt');
    const duration = document.getElementById('duration');
    const tests = document.getElementById('tests');
    const failures = document.getElementById('failures');
    const errors = document.getElementById('errors');
    const skipped = document.getElementById('skipped');
    const cases = document.getElementById('cases');
    const batchTotal = document.getElementById('batchTotal');
    const batchSuccess = document.getElementById('batchSuccess');
    const batchIssues = document.getElementById('batchIssues');
    const batchFailures = document.getElementById('batchFailures');
    const batchDrafts = document.getElementById('batchDrafts');
    const batchCases = document.getElementById('batchCases');
    const batchResultsTitle = document.getElementById('batchResultsTitle');
    const API_BASE_STORAGE_KEY = 'tradenix.report.apiBase';
    const queryParams = new URLSearchParams(window.location.search);
    const focusJobId = normalizeQueryValue(queryParams.get('jobId'));
    const focusMessageRef = normalizeQueryValue(queryParams.get('messageRef'));
    const requestedReportPrefix = String(queryParams.get('reportPrefix') || '').trim();
    const AUTO_REFRESH_INTERVAL_MS = 10000;
    const localReportScriptCandidates = [
        '../../../../target/report-data.js',
        '../../../../target/classes/static/report-data.js',
        '../../report-data.js'
    ];
    let autoRefreshTimer = null;
    let loadInProgress = false;

    function resolveApiBase() {
        const params = new URLSearchParams(window.location.search);
        const apiBaseFromQuery = params.get('apiBase');
        if (apiBaseFromQuery) {
            localStorage.setItem(API_BASE_STORAGE_KEY, apiBaseFromQuery);
            return apiBaseFromQuery.replace(/\/$/, '');
        }
        if (window.location.protocol === 'file:') {
            const stored = localStorage.getItem(API_BASE_STORAGE_KEY);
            return (stored || 'http://localhost:8080').replace(/\/$/, '');
        }
        return '';
    }

    const apiBase = resolveApiBase();
    const localArtifactBase = resolveLocalArtifactBase();

    function buildReportUrl() {
        const params = new URLSearchParams();
        if (focusJobId) {
            params.set('jobId', focusJobId);
        }
        if (focusMessageRef) {
            params.set('messageRef', focusMessageRef);
        }
        if (requestedReportPrefix) {
            params.set('reportPrefix', requestedReportPrefix);
        }
        const queryString = params.toString();
        return `${apiBase}/api/reports/latest${queryString ? `?${queryString}` : ''}`;
    }

    function normalizeQueryValue(value) {
        const normalized = String(value || '').trim().toUpperCase();
        return normalized || null;
    }

    function resolveLocalArtifactBase() {
        if (window.location.protocol !== 'file:') {
            return null;
        }
        const pathname = (window.location.pathname || '').replaceAll('\\', '/');
        if (pathname.includes('/src/main/resources/static/')) {
            return '../../../../target';
        }
        if (pathname.includes('/target/classes/static/')) {
            return '../../';
        }
        return '../../../../target';
    }

    function escapeHtml(value) {
        return String(value || '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;');
    }

    function renderArtifactLink(label, fileName) {
        if (!fileName) {
            return '';
        }
        const href = !apiBase && localArtifactBase
            ? `${localArtifactBase}/${encodeURIComponent(fileName)}`
            : `${apiBase}/api/reports/artifacts/${encodeURIComponent(fileName)}`;
        return `<a class="chip" href="${escapeHtml(href)}" target="_blank">${escapeHtml(label)}: ${escapeHtml(fileName)}</a>`;
    }

    function batchCaseMatchesRequestedPrefix(batchCase) {
        if (!requestedReportPrefix) {
            return true;
        }
        return [
            batchCase?.diagnosticsFile,
            batchCase?.screenshotFile,
            batchCase?.statusScreenshotFile
        ].some(value => String(value || '').startsWith(requestedReportPrefix));
    }

    function matchesFocusedCase(batchCase) {
        const batchJobId = normalizeQueryValue(batchCase?.jobId);
        const batchMessageRef = normalizeQueryValue(batchCase?.declarationNumber);
        if (focusJobId && batchJobId !== focusJobId) {
            return false;
        }
        if (focusMessageRef && batchMessageRef !== focusMessageRef) {
            return false;
        }
        return (!!(focusJobId || focusMessageRef) || !!requestedReportPrefix)
            && batchCaseMatchesRequestedPrefix(batchCase);
    }

    function summarizeBatchCases(batchCases) {
        const summary = {
            total: batchCases.length,
            successes: 0,
            issues: 0,
            failures: 0,
            drafts: 0
        };

        for (const batchCase of batchCases) {
            const displayStatus = String(batchCase?.jobStatus || batchCase?.status || '').toUpperCase();
            if (['PMT', 'SUB', 'REG', 'SUCCESS'].includes(displayStatus)) {
                summary.successes += 1;
            } else if (displayStatus === 'DRF') {
                summary.drafts += 1;
            } else if (['FLD', 'REJ', 'FAILURE'].includes(displayStatus)) {
                summary.failures += 1;
            } else if (['ISSUE', 'SNT'].includes(displayStatus)) {
                summary.issues += 1;
            }
        }

        return summary;
    }

    function applyFocusedCase(report) {
        if (!focusJobId && !focusMessageRef && !requestedReportPrefix) {
            return report;
        }
        const matchingBatchCases = (report?.batchCases || []).filter(matchesFocusedCase);
        if (!matchingBatchCases.length) {
            return report;
        }

        return {
            ...report,
            batchCases: matchingBatchCases,
            batchSummary: summarizeBatchCases(matchingBatchCases),
            primaryIssue: matchingBatchCases[0]?.message || report.primaryIssue
        };
    }

    function reportMatchesRequestedContext(report) {
        if (!focusJobId && !focusMessageRef && !requestedReportPrefix) {
            return true;
        }
        const batchCases = Array.isArray(report?.batchCases) ? report.batchCases : [];
        return batchCases.some(matchesFocusedCase);
    }

    function renderWaitingForRequestedReport(reportUrl) {
        const contextParts = [];
        if (focusJobId) {
            contextParts.push(`Job ID ${focusJobId}`);
        }
        if (focusMessageRef) {
            contextParts.push(`Message Ref ${focusMessageRef}`);
        }
        if (requestedReportPrefix) {
            contextParts.push(`Module ${requestedReportPrefix}`);
        }
        const contextText = contextParts.join(' | ') || 'latest submission';

        statusBadge.className = 'status-badge status-NO_REPORT';
        statusBadge.textContent = 'LOADING';
        issue.textContent = `Waiting for the completed report for ${contextText}.`;
        source.textContent = `Requested context: ${contextText} | API endpoint: ${reportUrl || 'embedded local data'}`;
        suiteName.textContent = 'Suite: waiting for matching report data';
        updatedAt.textContent = 'Updated: -';
        duration.textContent = 'Wrapper Duration: -';
        batchResultsTitle.textContent = 'Results';
        batchCases.innerHTML = '<div class="fine">A previous report was ignored because it did not match the latest requested job/module.</div>';
        cases.innerHTML = '<div class="fine">Waiting for matching wrapper test data.</div>';
        batchTotal.textContent = 0;
        batchSuccess.textContent = 0;
        batchIssues.textContent = 0;
        batchFailures.textContent = 0;
        batchDrafts.textContent = 0;
        tests.textContent = 0;
        failures.textContent = 0;
        errors.textContent = 0;
        skipped.textContent = 0;
        scheduleAutoRefresh();
    }

    function resolveResultsTitle(report) {
        const suiteName = String(report?.suiteName || '').toUpperCase();
        const batchCases = Array.isArray(report?.batchCases) ? report.batchCases : [];
        const declarationTypeDisplays = batchCases
            .map(batchCase => String(batchCase?.declarationTypeDisplay || batchCase?.declarationTypeCode || '').toUpperCase())
            .filter(Boolean);
        const diagnosticsTexts = batchCases
            .map(batchCase => String(batchCase?.diagnosticsText || batchCase?.responseSummary || '').toUpperCase())
            .filter(Boolean);

        if (suiteName.includes('IPTDECLARATIONTESTCASE1TEST')
            || declarationTypeDisplays.some(value => value.includes('DNG') || value.includes('IN-PAYMENT') || value === 'IPT')) {
            return 'IN-Payment (IPT) Results';
        }

        if (suiteName.includes('COODECLARATIONTESTCASE1TEST')
            || declarationTypeDisplays.some(value => value.includes('COO') || value.includes('CERTIFICATE OF ORIGIN'))
            || diagnosticsTexts.some(value => value.includes('DECLARATION TYPE: COO') || value.includes('CERTIFICATE OF ORIGIN'))) {
            return 'Certificate of Origin (COO) Results';
        }

        if (suiteName.includes('OUTDECLARATIONTESTCASE1TEST')
            || diagnosticsTexts.some(value => value.includes('DECLARATION TYPE: 20') || value.includes('DECLARATION TYPE: OUT'))
            || declarationTypeDisplays.some(value => value === '20' || value.includes('OUTWARD') || value === 'OUT')) {
            return 'OUTWARD (OUT) Results';
        }

        return 'Batch Results';
    }

    function renderReport(report) {
        stopAutoRefresh();
        const focusedReport = applyFocusedCase(report);
        const batchSummary = focusedReport.batchSummary || {};
        const selectedBatchCase = (focusedReport.batchCases || [])[0];
        const reportUrl = buildReportUrl();
        batchResultsTitle.textContent = resolveResultsTitle(focusedReport);

        statusBadge.className = `status-badge status-${focusedReport.status || 'NO_REPORT'}`;
        statusBadge.textContent = focusedReport.status || 'NO_REPORT';
        issue.textContent = focusedReport.primaryIssue || '';
        source.textContent = focusedReport.sourceFile
            ? `Surefire XML: ${focusedReport.sourceFile} | API: ${apiBase ? reportUrl : 'embedded local data'}${selectedBatchCase?.jobId ? ` | Job ID: ${selectedBatchCase.jobId}` : ''}`
            : `Surefire XML: not available | API: ${apiBase ? reportUrl : 'embedded local data'}${selectedBatchCase?.jobId ? ` | Job ID: ${selectedBatchCase.jobId}` : ''}`;
        suiteName.textContent = focusedReport.suiteName ? `Suite: ${focusedReport.suiteName}` : 'Suite: not available';
        updatedAt.textContent = focusedReport.updatedAt ? `Updated: ${focusedReport.updatedAt}` : 'Updated: -';
        duration.textContent = focusedReport.durationSeconds ? `Wrapper Duration: ${focusedReport.durationSeconds} s` : 'Wrapper Duration: -';

        batchTotal.textContent = batchSummary.total ?? 0;
        batchSuccess.textContent = batchSummary.successes ?? 0;
        batchIssues.textContent = batchSummary.issues ?? 0;
        batchFailures.textContent = batchSummary.failures ?? 0;
        batchDrafts.textContent = batchSummary.drafts ?? 0;

        tests.textContent = focusedReport.tests ?? 0;
        failures.textContent = focusedReport.failures ?? 0;
        errors.textContent = focusedReport.errors ?? 0;
        skipped.textContent = focusedReport.skipped ?? 0;

        batchCases.innerHTML = (focusedReport.batchCases || []).map(renderBatchCase).join('')
            || '<div class="fine">No batch declaration results available.</div>';
        cases.innerHTML = (focusedReport.testCases || []).map(renderCase).join('')
            || '<div class="fine">No wrapper test cases available.</div>';
    }

    function stopAutoRefresh() {
        if (autoRefreshTimer !== null) {
            window.clearTimeout(autoRefreshTimer);
            autoRefreshTimer = null;
        }
    }

    function scheduleAutoRefresh() {
        if (autoRefreshTimer !== null) {
            return;
        }
        autoRefreshTimer = window.setTimeout(() => {
            autoRefreshTimer = null;
            loadReport();
        }, AUTO_REFRESH_INTERVAL_MS);
    }

    async function loadLocalReportData() {
        if (window.location.protocol !== 'file:') {
            return null;
        }

        delete window.__REPORT_DATA__;
        document.querySelectorAll('script[data-report-script="true"]').forEach(script => script.remove());

        for (const candidate of localReportScriptCandidates) {
            try {
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = `${candidate}${candidate.includes('?') ? '&' : '?'}v=${Date.now()}`;
                    script.dataset.reportScript = 'true';
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
                if (window.__REPORT_DATA__) {
                    return window.__REPORT_DATA__;
                }
            } catch (error) {
            }
        }

        return null;
    }

    function renderBatchCase(batchCase) {
        const diagnostics = batchCase.diagnosticsText
            ? `<pre>${escapeHtml(batchCase.diagnosticsText)}</pre>`
            : '';
        const responseSummary = batchCase.responseSummary
            ? `<pre>${escapeHtml(batchCase.responseSummary)}</pre>`
            : '';
        const responseMessage = batchCase.responseMessage || 'N/A';
        const errorMessage = batchCase.errorMessage || 'N/A';
        const hasErrorDetails = errorMessage && errorMessage !== 'N/A';
        return `
            <div class="case">
                <div class="case-head">
                    <div>
                        <div class="case-name">Declaration ${escapeHtml(batchCase.index)}${batchCase.jobId ? ` | Job ${escapeHtml(batchCase.jobId)}` : ''}</div>
                        <div class="case-class">${escapeHtml(batchCase.message || '')}</div>
                    </div>
                    <div class="status-badge status-${escapeHtml(batchCase.jobStatus || batchCase.status || 'NO_REPORT')}">${escapeHtml(batchCase.jobStatus || batchCase.status || 'UNKNOWN')}</div>
                </div>
                <div class="detail-row">
                    <div class="fine">Declaration Type: ${escapeHtml(batchCase.declarationTypeDisplay || batchCase.declarationTypeCode || '-')}</div>
                    <div class="fine">Message Ref: ${escapeHtml(batchCase.declarationNumber || '-')}</div>
                    <div class="fine">Status: ${escapeHtml(batchCase.jobStatus || '-')}</div>
                    <div class="fine">Job ID: ${escapeHtml(batchCase.jobId || '-')}</div>
                    <div class="fine">Created By: ${escapeHtml(batchCase.jobCreatedBy || '-')}</div>
                    <div class="fine">Invalid Fields: ${escapeHtml(batchCase.invalidCount ?? 0)}</div>
                    <div class="fine">Updated: ${escapeHtml(batchCase.updatedAt || '-')}</div>
                </div>
                <div class="panel" style="margin-top: 12px; padding: 14px;">
                    <div class="label">Status Details</div>
                    <div class="fine" style="margin-top: 8px;">Response Message: ${escapeHtml(responseMessage)}</div>
                </div>
                <div class="panel" style="margin-top: 12px; padding: 14px; border-color: ${hasErrorDetails ? 'var(--failure)' : 'var(--border)'};">
                    <div class="label">Error Details</div>
                    <div class="fine" style="margin-top: 8px;">Error Message: ${escapeHtml(errorMessage)}</div>
                </div>
                ${responseSummary}
                <div class="chips">
                    ${renderArtifactLink('Diagnostics', batchCase.diagnosticsFile)}
                    ${renderArtifactLink('Submit Screenshot', batchCase.screenshotFile)}
                    ${renderArtifactLink('Status Screenshot', batchCase.statusScreenshotFile)}
                </div>
                ${diagnostics}
            </div>
        `;
    }

    function renderCase(testCase) {
        const detail = testCase.detail
            ? `<pre>${escapeHtml(testCase.detail)}</pre>`
            : '';
        const message = testCase.message
            ? `<div class="fine" style="margin-top: 8px;">${escapeHtml(testCase.message)}</div>`
            : '';
        return `
            <div class="case">
                <div class="case-head">
                    <div>
                        <div class="case-name">${escapeHtml(testCase.name || 'Unnamed test')}</div>
                        <div class="case-class">${escapeHtml(testCase.className || '')}</div>
                    </div>
                    <div class="status-badge status-${escapeHtml(testCase.status || 'NO_REPORT')}">${escapeHtml(testCase.status || 'UNKNOWN')}</div>
                </div>
                <div class="fine">Duration: ${escapeHtml(testCase.durationSeconds || '0')} s</div>
                ${message}
                ${detail}
            </div>
        `;
    }

    async function loadReport() {
        if (loadInProgress) {
            return;
        }
        loadInProgress = true;
        const reportUrl = buildReportUrl();
        try {
            const localReport = await loadLocalReportData();
            if (localReport && reportMatchesRequestedContext(localReport)) {
                renderReport(localReport);
                return;
            }

            let report;
            try {
                const response = await fetch(reportUrl, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                report = await response.json();
            } catch (error) {
                if (localReport && !reportMatchesRequestedContext(localReport)) {
                    renderWaitingForRequestedReport(reportUrl);
                    return;
                }
                statusBadge.className = 'status-badge status-NO_REPORT';
                statusBadge.textContent = 'NO_REPORT';
                issue.textContent = `Unable to load report from ${reportUrl}. Start the Spring app and open http://localhost:8080/report.html or append ?apiBase=http://localhost:8080 when using the file directly.`;
                source.textContent = `API endpoint: ${reportUrl}`;
                suiteName.textContent = 'Suite: not available';
                updatedAt.textContent = 'Updated: -';
                duration.textContent = 'Wrapper Duration: -';
                batchResultsTitle.textContent = 'Results';
                batchCases.innerHTML = '<div class="fine">No batch declaration results available.</div>';
                cases.innerHTML = '<div class="fine">No wrapper test cases available.</div>';
                batchTotal.textContent = 0;
                batchSuccess.textContent = 0;
                batchIssues.textContent = 0;
                batchFailures.textContent = 0;
                batchDrafts.textContent = 0;
                tests.textContent = 0;
                failures.textContent = 0;
                errors.textContent = 0;
                skipped.textContent = 0;
                scheduleAutoRefresh();
                return;
            }
            if (!reportMatchesRequestedContext(report)) {
                renderWaitingForRequestedReport(reportUrl);
                return;
            }
            renderReport(report);
        } finally {
            loadInProgress = false;
        }
    }

    document.getElementById('refreshBtn').addEventListener('click', () => {
        stopAutoRefresh();
        loadReport();
    });
    loadReport();
</script>
</body>
</html>
