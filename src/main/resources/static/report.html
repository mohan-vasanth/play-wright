<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Report</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --text: #16324f;
            --muted: #5f7186;
            --border: #d7e0ea;
            --success: #127a4a;
            --success-bg: #e8f7ef;
            --failure: #b42318;
            --failure-bg: #fdecec;
            --issue: #8a4b00;
            --issue-bg: #fff4df;
            --neutral: #1f6feb;
            --neutral-bg: #eaf2ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at top right, #dcecff 0, transparent 30%),
                linear-gradient(180deg, #f9fbfe 0, var(--bg) 100%);
            color: var(--text);
        }

        .wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        h1, h2, h3 {
            margin: 0;
        }

        h1 {
            font-size: 32px;
            line-height: 1.1;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 14px;
        }

        .sub {
            color: var(--muted);
            margin-top: 6px;
            font-size: 14px;
        }

        button {
            border: 1px solid #0b6bcb;
            background: #0b86d1;
            color: #fff;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(34, 68, 102, 0.08);
        }

        .hero {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 14px;
        }

        .status-SUCCESS {
            color: var(--success);
            background: var(--success-bg);
        }

        .status-PERMIT_ISSUED {
            color: var(--success);
            background: var(--success-bg);
        }

        .status-FAILURE {
            color: var(--failure);
            background: var(--failure-bg);
        }

        .status-FAILED {
            color: var(--failure);
            background: var(--failure-bg);
        }

        .status-ISSUE {
            color: var(--issue);
            background: var(--issue-bg);
        }

        .status-DRAFT {
            color: var(--neutral);
            background: var(--neutral-bg);
        }

        .status-NO_REPORT, .status-SKIPPED {
            color: var(--neutral);
            background: var(--neutral-bg);
        }

        .issue {
            margin-top: 18px;
            font-size: 18px;
            line-height: 1.5;
        }

        .meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .metric {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            background: #fbfdff;
        }

        .metric .label {
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .metric .value {
            font-size: 24px;
            font-weight: 700;
            margin-top: 8px;
        }

        .grid {
            display: grid;
            gap: 20px;
        }

        .cases {
            display: grid;
            gap: 12px;
        }

        .case {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            background: #fff;
        }

        .case-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .case-name {
            font-weight: 700;
            font-size: 18px;
        }

        .case-class, .fine {
            color: var(--muted);
            font-size: 13px;
        }

        .detail-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px 10px;
            background: #f8fbff;
            color: var(--text);
            font-size: 12px;
            text-decoration: none;
        }

        pre {
            margin: 12px 0 0;
            padding: 12px;
            border-radius: 12px;
            background: #0f1720;
            color: #dde7f1;
            overflow: auto;
            white-space: pre-wrap;
            font-size: 12px;
        }

        @media (max-width: 760px) {
            .hero {
                grid-template-columns: 1fr;
            }

            .meta,
            .detail-row {
                grid-template-columns: 1fr 1fr;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <div>
            <h1>Automation Report</h1>
            <div class="sub">Batch declaration results from the latest Maven run</div>
        </div>
        <button id="refreshBtn" type="button">Refresh</button>
    </div>

    <div class="hero">
        <div class="panel">
            <div id="statusBadge" class="status-badge status-NO_REPORT">Loading</div>
            <div id="issue" class="issue">Fetching latest report...</div>
            <div id="source" class="fine" style="margin-top: 14px;"></div>
        </div>
        <div class="meta">
            <div class="metric">
                <div class="label">Declarations</div>
                <div id="batchTotal" class="value">0</div>
            </div>
            <div class="metric">
                <div class="label">Success</div>
                <div id="batchSuccess" class="value">0</div>
            </div>
            <div class="metric">
                <div class="label">Issues</div>
                <div id="batchIssues" class="value">0</div>
            </div>
            <div class="metric">
                <div class="label">Failures</div>
                <div id="batchFailures" class="value">0</div>
            </div>
            <div class="metric">
                <div class="label">Drafts</div>
                <div id="batchDrafts" class="value">0</div>
            </div>
        </div>
    </div>

    <div class="grid">
        <div class="panel">
            <h2>Batch Results</h2>
            <div id="batchCases" class="cases"></div>
        </div>

        <div class="panel">
            <h2>JUnit Wrapper</h2>
            <div id="suiteName" class="fine"></div>
            <div id="updatedAt" class="fine" style="margin-top: 6px;"></div>
            <div id="duration" class="fine" style="margin-top: 6px;"></div>
            <div class="detail-row" style="margin-top: 16px;">
                <div class="metric">
                    <div class="label">Wrapper Tests</div>
                    <div id="tests" class="value">0</div>
                </div>
                <div class="metric">
                    <div class="label">Wrapper Failures</div>
                    <div id="failures" class="value">0</div>
                </div>
                <div class="metric">
                    <div class="label">Wrapper Errors</div>
                    <div id="errors" class="value">0</div>
                </div>
                <div class="metric">
                    <div class="label">Wrapper Skipped</div>
                    <div id="skipped" class="value">0</div>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2>Wrapper Test Cases</h2>
            <div id="cases" class="cases"></div>
        </div>
    </div>
</div>

<script>
    const statusBadge = document.getElementById('statusBadge');
    const issue = document.getElementById('issue');
    const source = document.getElementById('source');
    const suiteName = document.getElementById('suiteName');
    const updatedAt = document.getElementById('updatedAt');
    const duration = document.getElementById('duration');
    const tests = document.getElementById('tests');
    const failures = document.getElementById('failures');
    const errors = document.getElementById('errors');
    const skipped = document.getElementById('skipped');
    const cases = document.getElementById('cases');
    const batchTotal = document.getElementById('batchTotal');
    const batchSuccess = document.getElementById('batchSuccess');
    const batchIssues = document.getElementById('batchIssues');
    const batchFailures = document.getElementById('batchFailures');
    const batchDrafts = document.getElementById('batchDrafts');
    const batchCases = document.getElementById('batchCases');

    function escapeHtml(value) {
        return String(value || '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;');
    }

    function renderArtifactLink(label, fileName) {
        if (!fileName) {
            return '';
        }
        return `<a class="chip" href="/api/reports/artifacts/${encodeURIComponent(fileName)}" target="_blank">${escapeHtml(label)}: ${escapeHtml(fileName)}</a>`;
    }

    function renderBatchCase(batchCase) {
        const diagnostics = batchCase.diagnosticsText
            ? `<pre>${escapeHtml(batchCase.diagnosticsText)}</pre>`
            : '';
        const toast = batchCase.toastText
            ? `<div class="fine" style="margin-top: 8px;">Toast: ${escapeHtml(batchCase.toastText)}</div>`
            : '';
        return `
            <div class="case">
                <div class="case-head">
                    <div>
                        <div class="case-name">Declaration ${escapeHtml(batchCase.index)}</div>
                        <div class="case-class">${escapeHtml(batchCase.message || '')}</div>
                    </div>
                    <div class="status-badge status-${escapeHtml(batchCase.jobStatus || batchCase.status || 'NO_REPORT')}">${escapeHtml(batchCase.jobStatus || batchCase.status || 'UNKNOWN')}</div>
                </div>
                <div class="detail-row">
                    <div class="fine">Declaration Type: ${escapeHtml(batchCase.declarationTypeDisplay || batchCase.declarationTypeCode || '-')}</div>
                    <div class="fine">Status: ${escapeHtml(batchCase.jobStatus || '-')}</div>
                    <div class="fine">Job ID: ${escapeHtml(batchCase.jobId || '-')}</div>
                    <div class="fine">Invalid Fields: ${escapeHtml(batchCase.invalidCount ?? 0)}</div>
                    <div class="fine">Updated: ${escapeHtml(batchCase.updatedAt || '-')}</div>
                </div>
                ${toast}
                <div class="chips">
                    ${renderArtifactLink('Diagnostics', batchCase.diagnosticsFile)}
                    ${renderArtifactLink('Screenshot', batchCase.screenshotFile)}
                </div>
                ${diagnostics}
            </div>
        `;
    }

    function renderCase(testCase) {
        const detail = testCase.detail
            ? `<pre>${escapeHtml(testCase.detail)}</pre>`
            : '';
        const message = testCase.message
            ? `<div class="fine" style="margin-top: 8px;">${escapeHtml(testCase.message)}</div>`
            : '';
        return `
            <div class="case">
                <div class="case-head">
                    <div>
                        <div class="case-name">${escapeHtml(testCase.name || 'Unnamed test')}</div>
                        <div class="case-class">${escapeHtml(testCase.className || '')}</div>
                    </div>
                    <div class="status-badge status-${escapeHtml(testCase.status || 'NO_REPORT')}">${escapeHtml(testCase.status || 'UNKNOWN')}</div>
                </div>
                <div class="fine">Duration: ${escapeHtml(testCase.durationSeconds || '0')} s</div>
                ${message}
                ${detail}
            </div>
        `;
    }

    async function loadReport() {
        const response = await fetch('/api/reports/latest', { cache: 'no-store' });
        const report = await response.json();
        const batchSummary = report.batchSummary || {};

        statusBadge.className = `status-badge status-${report.status || 'NO_REPORT'}`;
        statusBadge.textContent = report.status || 'NO_REPORT';
        issue.textContent = report.primaryIssue || '';
        source.textContent = report.sourceFile ? `Surefire XML: ${report.sourceFile}` : 'Surefire XML: not available';
        suiteName.textContent = report.suiteName ? `Suite: ${report.suiteName}` : 'Suite: not available';
        updatedAt.textContent = report.updatedAt ? `Updated: ${report.updatedAt}` : 'Updated: -';
        duration.textContent = report.durationSeconds ? `Wrapper Duration: ${report.durationSeconds} s` : 'Wrapper Duration: -';

        batchTotal.textContent = batchSummary.total ?? 0;
        batchSuccess.textContent = batchSummary.successes ?? 0;
        batchIssues.textContent = batchSummary.issues ?? 0;
        batchFailures.textContent = batchSummary.failures ?? 0;
        batchDrafts.textContent = batchSummary.drafts ?? 0;

        tests.textContent = report.tests ?? 0;
        failures.textContent = report.failures ?? 0;
        errors.textContent = report.errors ?? 0;
        skipped.textContent = report.skipped ?? 0;

        batchCases.innerHTML = (report.batchCases || []).map(renderBatchCase).join('')
            || '<div class="fine">No batch declaration results available.</div>';
        cases.innerHTML = (report.testCases || []).map(renderCase).join('')
            || '<div class="fine">No wrapper test cases available.</div>';
    }

    document.getElementById('refreshBtn').addEventListener('click', loadReport);
    loadReport();
    setInterval(loadReport, 10000);
</script>
</body>
</html>
