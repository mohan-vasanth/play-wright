    function normalizeApiBase(base) {
        return String(base || '').trim().replace(/\/$/, '');
    }

    function defaultApiBaseUrl() {
        return window.location.protocol === 'file:' ? 'http://localhost:8080' : normalizeApiBase(window.location.origin);

    function resolveInitialApiBaseUrl() {
        const params = new URLSearchParams(window.location.search);
        const apiBaseFromQuery = normalizeApiBase(params.get('apiBase'));
        if (apiBaseFromQuery) {
            localStorage.setItem(API_BASE_STORAGE_KEY, apiBaseFromQuery);
            return apiBaseFromQuery;
        }
        const stored = normalizeApiBase(localStorage.getItem(API_BASE_STORAGE_KEY));
        return stored || defaultApiBaseUrl();
    }

    async function fetchJson(url, options) {
        const response = await fetch(url, {
            cache: 'no-store',
            ...options
        });
        const text = await response.text();
        let payload = {};
        if (text) {
            try {
                payload = JSON.parse(text);
            } catch (_) {
                payload = { message: text };
            }
        }
        if (!response.ok) {
            throw new Error(payload.message || payload.error || 'Request failed.');
        }
        return payload;
    }

    function clamp(value, min, max) {
        return Math.min(max, Math.max(min, Number(value) || 0));
    }

    function formatDateTime(value) {
        if (!value) {
            return 'N/A';
        }
        if (/^\d{8}$/.test(String(value).trim())) {
            const normalized = String(value).trim();
            const parsed = new Date(`${normalized.substring(0, 4)}-${normalized.substring(4, 6)}-${normalized.substring(6, 8)}T00:00:00`);
            return Number.isNaN(parsed.getTime()) ? value : parsed.toLocaleDateString();
        }
        if (/^\d{4}-\d{2}-\d{2}$/.test(String(value).trim())) {
            const parsed = new Date(`${String(value).trim()}T00:00:00`);
            return Number.isNaN(parsed.getTime()) ? value : parsed.toLocaleDateString();
        }
        const parsed = new Date(value);
        return Number.isNaN(parsed.getTime()) ? value : parsed.toLocaleString();
    }

    function formatMetric(value, suffix = '') {
        const numeric = Number(value) || 0;
        if (numeric >= 1000) {
            return `${numeric.toLocaleString()}${suffix}`;
        }
        if (numeric % 1 !== 0) {
            return `${numeric.toFixed(2)}${suffix}`;
        }
        return `${numeric}${suffix}`;
    }

    function statusAccent(status) {

    function buildHistoryPoint(payload) {

            throughput: Number(payload.throughput || 0),
            responseTime: Number(payload.averageResponseTime || 0),
            errorPercentage: Number(payload.errorPercentage || 0)
        };
    }

    function triggerDownload(fileName, content, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = fileName;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 250);
    }

    function MiniLineChart({ points, color }) {
        const width = 320;
        const height = 90;
        const safePoints = points && points.length ? points : [0, 0, 0, 0];
        const max = Math.max(...safePoints, 1);
        const step = safePoints.length > 1 ? width / (safePoints.length - 1) : width;
        const coordinates = safePoints.map((point, index) => {
            const x = index * step;
            const y = height - (point / max) * (height - 12) - 6;
            return `${x},${y}`;
        }).join(' ');
        const area = `0,${height} ${coordinates} ${width},${height}`;

        return (
            <Box component="svg" viewBox={`0 0 ${width} ${height}`} sx={{ width: '100%', height: 90 }}>
                <defs>
                    <linearGradient id={`fill-${color.replace('#', '')}`} x1="0" x2="0" y1="0" y2="1">
                        <stop offset="0%" stopColor={alpha(color, 0.35)} />
                        <stop offset="100%" stopColor={alpha(color, 0)} />
                    </linearGradient>
                </defs>
                <path d={`M ${area}`} fill={`url(#fill-${color.replace('#', '')})`} />
                <polyline
                    fill="none"
                    stroke={color}
                    strokeWidth="3"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    points={coordinates}
                />
            </Box>
        );
    }

        const activeUserTrend = history.map(point => point.activeUsers);

        const combinedLogs = [

        function rememberApiBase(base) {
            const normalized = normalizeApiBase(base);
            if (!normalized) {
                return;
            }
            localStorage.setItem(API_BASE_STORAGE_KEY, normalized);
            setApiBaseUrl(current => current === normalized ? current : normalized);
        }

        function apiBaseCandidates() {
            const candidates = [];
            const seen = new Set();

            function addCandidate(base) {
                const normalized = normalizeApiBase(base);
                if (!normalized || seen.has(normalized)) {
                    return;
                }
                seen.add(normalized);
                candidates.push(normalized);
            }

            addCandidate(apiBaseUrl);
            addCandidate(localStorage.getItem(API_BASE_STORAGE_KEY));
            if (window.location.protocol !== 'file:') {
                addCandidate(window.location.origin);
            }
            addCandidate('http://localhost:8080');
            addCandidate('http://127.0.0.1:8080');
            return candidates;
        }

        function resolveApiUrlForBase(base, path) {
            const normalizedBase = normalizeApiBase(base) || defaultApiBaseUrl();
            try {
                return new URL(path, normalizedBase.endsWith('/') ? normalizedBase : `${normalizedBase}/`).toString();
            } catch (_) {
                return null;
            }
        }

        function resolveApiUrl(path) {
            return resolveApiUrlForBase(apiBaseUrl, path);
        }

        function resolveArtifactUrl(path) {
            if (!path) {
                return null;
            }
            if (/^https?:\/\//i.test(path)) {
                return path;
            }
            return resolveApiUrl(path.replace(/^\//, ''));
        }

        async function fetchFromApi(path, options) {
            let lastError = null;
            for (const candidate of apiBaseCandidates()) {
                const resolvedUrl = resolveApiUrlForBase(candidate, path);
                if (!resolvedUrl) {
                    continue;
                }
                try {
                    const payload = await fetchJson(resolvedUrl, options);
                    rememberApiBase(candidate);
                    return payload;
                } catch (error) {
                    if (!(error instanceof TypeError) || !/fetch/i.test(error.message || '')) {
                        throw error;
                    }
                    lastError = error;
                }
            }
            throw lastError || new Error('Could not reach the dashboard API. Start the Spring Boot app and verify the API base URL.');
        }

            localStorage.setItem(API_BASE_STORAGE_KEY, normalizeApiBase(apiBaseUrl));

                setDeclarationTypes(types);
                setForm(current => {
                    const selectedType = types.some(option => option.value === current.declarationType)
                        ? current.declarationType
                        : (types[0]?.value || '');
                    return {
                        ...current,
                        declarationType: selectedType
                    };
                });
            } catch (error) {
                setDeclarationTypes([]);
                showToast('error', `Unable to load declaration types: ${error.message}`);
            }
        }

        async function loadJsonOptions(type) {
            if (!type) {
                setJsonOptions([]);
                setJsonOptionsMeta(null);
                setForm(current => ({ ...current, selectedJson: '' }));
                return;
            }

            setJsonOptionsLoading(true);
            try {
                const payload = await fetchFromApi(`api/load-dashboard/json-options?type=${encodeURIComponent(type)}`);
                const files = payload.files || [];
                setJsonOptions(files);
                setJsonOptionsMeta(payload);
                setForm(current => {
                    const exists = files.some(file => file.resourcePath === current.selectedJson);
                    return {
                        ...current,
                        selectedJson: exists ? current.selectedJson : (files[0]?.resourcePath || '')
                    };
                });
            } catch (error) {
                setJsonOptions([]);
                setJsonOptionsMeta(null);
                setForm(current => ({ ...current, selectedJson: '' }));
                showToast('error', `Unable to load declaration JSON files: ${error.message}`);
            } finally {
                setJsonOptionsLoading(false);
            }
        }

                                        />
                                        <Grid container spacing={2}>
                                            {(status.screenshots || []).slice(0, 8).map(item => (
                                                <Grid item xs={12} sm={6} lg={3} key={`${item.userIndex}-${item.imageUrl}`}>
                                                    <GlassPanel sx={{ p: 1.2, borderRadius: 4, height: '100%' }}>
                                                        <Box
                                                            component="img"
                                                            src={resolveArtifactUrl(item.imageUrl) || undefined}
                                                            alt={`User ${item.userIndex} ${item.outcome}`}
                                                            sx={{
                                                                width: '100%',
                                                                aspectRatio: '16/10',
                                                                objectFit: 'cover',
                                                                display: 'block',
                                                                borderRadius: 3
                                                            }}
                                                        />
                                                        <Box sx={{ p: 1.2 }}>
                                                            <Stack direction="row" justifyContent="space-between" alignItems="center">
                                                                <Typography variant="subtitle2" sx={{ fontWeight: 800 }}>
                                                                    User {item.userIndex}
                                                                </Typography>
                                                                <StatusBadge label={item.outcome || 'PENDING'} />
                                                            </Stack>
                                                            <Typography variant="body2" color="text.secondary" sx={{ mt: 1, lineHeight: 1.7 }}>
                                                                {item.summary || 'Workflow screenshot'}
                                                            </Typography>
                                                        </Box>
                                                    </GlassPanel>
                                                </Grid>
                                            ))}
                                        </Grid>
                                    </GlassPanel>
                                </Box>
                            ) : null}
                        </Box>
                    </Box>

                    <Snackbar
                        open={toast.open}
                        autoHideDuration={4500}
                        onClose={() => setToast(current => ({ ...current, open: false }))}
                        anchorOrigin={{ vertical: 'bottom', horizontal: 'right' }}
                    >
                        <Alert
                            severity={toast.severity}
                            variant="filled"
                            onClose={() => setToast(current => ({ ...current, open: false }))}
                            sx={{ borderRadius: 3 }}
                        >
                            {toast.message}
                        </Alert>
                    </Snackbar>
                    <Dialog
                        open={textPreview.open}
                        onClose={closeTextPreview}
                        fullWidth
                        maxWidth="md"
                    >
                        <DialogTitle sx={{ fontWeight: 800 }}>
                            {textPreview.title || 'Details'}
                        </DialogTitle>
                        <DialogContent dividers>
                            <Typography
                                variant="body1"
                                sx={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word', lineHeight: 1.8 }}
                            >
                                {textPreview.value || 'N/A'}
                            </Typography>
                        </DialogContent>
                        <DialogActions>
                            <Button onClick={closeTextPreview} variant="contained">
                                Close
                            </Button>
                        </DialogActions>
                    </Dialog>
                    <Drawer
                        anchor="right"
                        open={columnDrawerOpen}
                        onClose={closeColumnDrawer}
                    >
                        <Box
                            sx={{
                                width: { xs: '100vw', sm: 380 },
                                p: 2.4,
                                height: '100%',
                                background: '#111c35'
                            }}
                        >
                            <Stack direction="row" justifyContent="space-between" alignItems="flex-start" spacing={2}>
                                <Box>
                                    <Typography variant="h6" sx={{ fontWeight: 800 }}>
                                        Custom Columns
                                    </Typography>
                                    <Typography variant="body2" color="text.secondary" sx={{ mt: 1, lineHeight: 1.8 }}>
                                        Choose which columns are visible in the Per-User Execution Grid.
                                    </Typography>
                                </Box>
                                <Button onClick={closeColumnDrawer} sx={{ minWidth: 0, px: 1.2 }}>
                                    Close
                                </Button>
                            </Stack>
                            <Stack direction="row" spacing={1.2} sx={{ mt: 2.4, mb: 2 }}>
                                <Button variant="contained" onClick={showAllGridColumns} sx={{ borderRadius: 999, fontWeight: 800 }}>
                                    Select All
                                </Button>
                                <Button variant="outlined" onClick={resetGridColumns} sx={{ borderRadius: 999, fontWeight: 800 }}>
                                    Reset
                                </Button>
                            </Stack>
                            <Typography variant="caption" color="text.secondary">
                                At least one column remains visible.
                            </Typography>
                            <Stack spacing={0.4} sx={{ mt: 2.2 }}>
                                {gridColumns.map(column => {
                                    const checked = visibleGridColumns.includes(column.key);
                                    const onlyOneVisible = visibleGridColumns.length === 1 && checked;
                                    return (
                                        <FormControlLabel
                                            key={column.key}
                                            control={(
                                                <Checkbox
                                                    checked={checked}
                                                    onChange={() => toggleGridColumn(column.key)}
                                                    disabled={onlyOneVisible}
                                                />
                                            )}
                                            label={column.label}
                                            sx={{
                                                mx: 0,
                                                px: 1,
                                                py: 0.2,
                                                borderRadius: 2,
                                                '&:hover': {
                                                    backgroundColor: 'rgba(148, 163, 184, 0.08)'
                                                }
                                            }}
                                        />
                                    );
                                })}
                            </Stack>
                        </Box>
                    </Drawer>
                </Box>
            </ThemeProvider>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
