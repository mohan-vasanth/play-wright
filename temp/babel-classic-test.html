<!DOCTYPE html>
<html>
<head>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
window.addEventListener('error', function (event) {
  document.body.insertAdjacentHTML('beforeend', '<pre id="err">' + String(event.message) + '</pre>');
});
Babel.registerPreset('react-classic', {
  plugins: [[Babel.availablePlugins['transform-react-jsx'], { runtime: 'classic' }]]
});
</script>
<script type="text/babel" data-presets="env,react-classic">
  function App() { return <div>Hello</div>; }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
